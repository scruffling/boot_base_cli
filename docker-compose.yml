services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    image: golang-boot-dev:latest
    container_name: golang-boot-app
    
    # Keep container running
    command: tail -f /dev/null
    
    # Mount current directory to /app in container
    volumes:
      - ../boot_apps:/app:z
    
    # Set working directory
    working_dir: /app
    
    # Podman: keep host UID inside container
    userns_mode: "keep-id"
    
    # Environment variables (customize as needed)
    environment:
      - GO111MODULE=on
    
    # Expose ports (customize as needed)
    ports:
      - "127.0.0.1:3000:3000"  # Node.js app
      - "127.0.0.1:8080:8080"  # Go app
    
    # Optional: add network mode
    # network_mode: bridge
